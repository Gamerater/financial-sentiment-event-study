<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentiment &amp; Price Movement — Event Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F5F0;
    --paper-raised: #FCFBF8;
    --ink: #1A1F2B;
    --ink-soft: #4A4E58;
    --grey: #6B6459;
    --line: #DCD8CD;
    --positive: #2D5F4C;
    --negative: #8B3A3A;
    --gold: #9C7A2E;
    --gold-bg: #F1E8D2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 56px 32px 96px;
  }

  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 24px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }

  header h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    max-width: 620px;
  }

  header p.subtitle {
    margin: 0;
    color: var(--grey);
    font-size: 14px;
  }

  #reload-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  #reload-btn:hover { background: var(--ink-soft); }
  #reload-btn:disabled { opacity: 0.5; cursor: default; }

  /* Tab navigation */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 40px;
  }

  .tab {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--grey);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 14px;
    cursor: pointer;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--gold);
  }
  .tab .tab-count {
    color: var(--grey);
    font-size: 11.5px;
    margin-left: 4px;
  }

  .stat-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 48px;
  }

  .stat {
    padding: 20px 20px 20px 0;
    border-right: 1px solid var(--line);
  }
  .stat:last-child { border-right: none; padding-right: 0; }

  .stat .label {
    font-size: 12px;
    color: var(--grey);
    margin-bottom: 6px;
  }

  .stat .value {
    font-family: 'Source Serif 4', serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--ink);
  }

  .stat .value.accent { color: var(--gold); }
  .stat .note { font-size: 12px; color: var(--grey); margin-top: 4px; }

  section { margin-bottom: 52px; }

  h2 {
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 4px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  h2 .count {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--grey);
  }

  .test-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 20px;
  }

  .test-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 18px 20px;
  }

  .test-card h3 {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    text-transform: none;
    color: var(--grey);
    margin: 0 0 12px;
  }

  .test-card .row {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--line);
  }
  .test-card .row:last-child { border-bottom: none; }
  .test-card .row .k { color: var(--ink-soft); }
  .test-card .row .v { font-weight: 500; font-variant-numeric: tabular-nums; }

  .sig-true { color: var(--positive); font-weight: 600; }
  .sig-false { color: var(--grey); }

  .error-note {
    font-size: 13px;
    color: var(--grey);
    font-style: italic;
    padding: 6px 0;
  }

  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 20px;
  }

  .chart-box {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 12px;
  }
  .chart-box img {
    width: 100%;
    display: block;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 13.5px;
  }

  thead th {
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    color: var(--grey);
    padding: 8px 12px 8px 0;
    border-bottom: 1px solid var(--ink);
  }

  tbody td {
    padding: 10px 12px 10px 0;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }

  tbody tr:hover { background: var(--paper-raised); }
  tbody tr.clickable { cursor: pointer; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    font-size: 11.5px;
    font-weight: 600;
    border-radius: 2px;
  }
  .badge.positive { background: #E6EEE9; color: var(--positive); }
  .badge.negative { background: #F3E5E5; color: var(--negative); }
  .badge.neutral { background: #EDEBE5; color: var(--grey); }

  .ticker-link {
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px dotted var(--grey);
  }
  .ticker-link:hover { color: var(--gold); border-bottom-color: var(--gold); }

  .car-pos { color: var(--positive); font-weight: 600; }
  .car-neg { color: var(--negative); font-weight: 600; }

  .title-cell {
    max-width: 340px;
    color: var(--ink-soft);
  }

  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--grey);
    border: 1px dashed var(--line);
  }
  .empty-state h3 {
    font-family: 'Source Serif 4', serif;
    color: var(--ink);
    font-size: 18px;
    margin-bottom: 8px;
  }

  /* Per-ticker overview grid (shown on the "All stocks" tab) */
  .ticker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .ticker-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 16px;
    cursor: pointer;
  }
  .ticker-card:hover { border-color: var(--gold); }
  .ticker-card .tk-symbol {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    font-weight: 700;
  }
  .ticker-card .tk-n {
    font-size: 12px;
    color: var(--grey);
    margin-bottom: 10px;
  }
  .ticker-card .tk-car {
    font-size: 20px;
    font-weight: 600;
    font-family: 'Source Serif 4', serif;
  }
  .ticker-card .tk-car-label {
    font-size: 11px;
    color: var(--grey);
  }

  footer {
    margin-top: 64px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--grey);
  }

  @media (max-width: 720px) {
    .stat-strip { grid-template-columns: repeat(2, 1fr); }
    .test-grid, .charts-grid { grid-template-columns: 1fr; }
    .stat:nth-child(2) { border-right: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Correlating Financial News Sentiment with Short-Term Stock Price Movement</h1>
      <p class="subtitle">An event-study approach · tech sector</p>
    </div>
    <button id="reload-btn" onclick="loadResults()">Reload results</button>
  </header>

  <div id="tabs" class="tabs" style="display:none;"></div>

  <div id="content">
    <div class="empty-state"><h3>Loading…</h3></div>
  </div>

  <footer>
    Dashboard reads the latest output of <code>run_pipeline.py</code> from disk. Run the pipeline in a terminal, then reload here — this page does not fetch data or run the model itself.
  </footer>

</div>

<script>
let LAST_DATA = null;
let ACTIVE_TAB = 'all';

function fmtPct(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  return (n * 100).toFixed(2) + '%';
}
function fmtNum(v, digits=3) {
  const n = parseFloat(v);
  if (n === null || v === null || isNaN(n)) return '—';
  return n.toFixed(digits);
}
function sigClass(v) {
  return (v === 'True' || v === true) ? 'sig-true' : 'sig-false';
}
function sigLabel(v) {
  return (v === 'True' || v === true) ? 'Significant (p<0.05)' : 'Not significant';
}

function renderTestCard(title, data) {
  if (!data || Object.keys(data).length === 0) {
    return `<div class="test-card"><h3>${title}</h3><div class="error-note">No data yet</div></div>`;
  }
  if (data.error) {
    return `<div class="test-card"><h3>${title}</h3><div class="error-note">${data.error}</div></div>`;
  }
  let rows = '';
  for (const [k, v] of Object.entries(data)) {
    if (k === 'significant_at_0.05') continue;
    let displayV = v;
    if (k.toLowerCase().includes('mean_car') || k === 'pearson_r') displayV = fmtNum(v, 4);
    else if (k === 'p_value') displayV = fmtNum(v, 4);
    else if (k.includes('t_statistic')) displayV = fmtNum(v, 3);
    rows += `<div class="row"><span class="k">${k}</span><span class="v">${displayV}</span></div>`;
  }
  if ('significant_at_0.05' in data) {
    rows += `<div class="row"><span class="k">Result</span><span class="v ${sigClass(data['significant_at_0.05'])}">${sigLabel(data['significant_at_0.05'])}</span></div>`;
  }
  return `<div class="test-card"><h3>${title}</h3>${rows}</div>`;
}

function switchTab(tab) {
  ACTIVE_TAB = tab;
  renderTabs();
  renderContent();
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  if (!LAST_DATA || !LAST_DATA.has_data) {
    tabsEl.style.display = 'none';
    return;
  }
  const tickers = Object.keys(LAST_DATA.per_ticker || {}).sort();
  let html = `<button class="tab ${ACTIVE_TAB === 'all' ? 'active' : ''}" onclick="switchTab('all')">All stocks</button>`;
  for (const t of tickers) {
    const n = LAST_DATA.per_ticker[t].n_events;
    html += `<button class="tab ${ACTIVE_TAB === t ? 'active' : ''}" onclick="switchTab('${t}')">${t}<span class="tab-count">${n}</span></button>`;
  }
  tabsEl.innerHTML = html;
  tabsEl.style.display = 'flex';
}

async function loadResults() {
  const btn = document.getElementById('reload-btn');
  btn.disabled = true;
  btn.textContent = 'Loading…';

  try {
    const res = await fetch('/api/results');
    const data = await res.json();
    LAST_DATA = data;
    renderTabs();
    renderContent();
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="empty-state"><h3>Could not load results</h3><p>${e}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Reload results';
  }
}

function renderContent() {
  const data = LAST_DATA;
  const content = document.getElementById('content');

  if (!data || !data.has_data) {
    content.innerHTML = `
      <div class="empty-state">
        <h3>No results yet</h3>
        <p>Run <code>python run_pipeline.py</code> in a terminal, then click "Reload results".</p>
      </div>`;
    return;
  }

  if (ACTIVE_TAB === 'all') {
    renderAllStocksView(data);
  } else {
    renderTickerView(data, ACTIVE_TAB);
  }
}

function renderAllStocksView(data) {
  const content = document.getElementById('content');
  const corr = data.summary.correlation || {};
  const nEvents = data.summary.events_analyzed || data.n_events;
  const dates = data.events.map(e => e.datetime).sort();
  const dateRange = dates.length ? `${dates[0]} to ${dates[dates.length-1]}` : '—';

  let html = '';

  html += `<div class="stat-strip">
    <div class="stat">
      <div class="label">Events analyzed</div>
      <div class="value">${nEvents}</div>
      <div class="note">unique ticker-day observations</div>
    </div>
    <div class="stat">
      <div class="label">Sentiment–return correlation</div>
      <div class="value accent">${corr.pearson_r ? fmtNum(corr.pearson_r, 3) : '—'}</div>
      <div class="note">Pearson r, all events</div>
    </div>
    <div class="stat">
      <div class="label">p-value</div>
      <div class="value">${corr.p_value ? fmtNum(corr.p_value, 3) : '—'}</div>
      <div class="note">${corr['significant_at_0.05'] === 'True' ? 'significant at 0.05' : 'not significant at 0.05'}</div>
    </div>
    <div class="stat">
      <div class="label">Date range</div>
      <div class="value" style="font-size:18px;">${dateRange}</div>
      <div class="note">event dates covered</div>
    </div>
  </div>`;

  // Per-ticker overview cards
  const tickers = Object.keys(data.per_ticker || {}).sort();
  if (tickers.length > 0) {
    html += `<section>
      <h2>By Ticker <span class="count">(click a stock for detail)</span></h2>
      <div class="ticker-grid">`;
    for (const t of tickers) {
      const s = data.per_ticker[t];
      const carClass = s.mean_CAR >= 0 ? 'car-pos' : 'car-neg';
      html += `<div class="ticker-card" onclick="switchTab('${t}')">
        <div class="tk-symbol">${t}</div>
        <div class="tk-n">${s.n_events} event${s.n_events === 1 ? '' : 's'}</div>
        <div class="tk-car ${carClass}">${fmtPct(s.mean_CAR)}</div>
        <div class="tk-car-label">mean CAR</div>
      </div>`;
    }
    html += `</div></section>`;
  }

  html += `<section>
    <h2>Statistical Tests <span class="count">(all tickers combined)</span></h2>
    <div class="test-grid">
      ${renderTestCard('Group comparison — positive vs negative sentiment', data.summary.group_ttest)}
      ${renderTestCard('Correlation — sentiment score vs CAR', data.summary.correlation)}
      ${renderTestCard('One-sample test — positive events vs zero', data.summary.one_sample.positive)}
      ${renderTestCard('One-sample test — negative events vs zero', data.summary.one_sample.negative)}
    </div>
  </section>`;

  if (data.figures.length > 0) {
    html += `<section>
      <h2>Figures</h2>
      <div class="charts-grid">
        ${data.figures.map(f => `<div class="chart-box"><img src="/figures/${f}?t=${Date.now()}" alt="${f}"></div>`).join('')}
      </div>
    </section>`;
  }

  html += renderEventsTable(data.events, `Event Dataset <span class="count">(${data.events.length} shown, most recent first)</span>`, true);

  content.innerHTML = html;
}

function renderTickerView(data, ticker) {
  const content = document.getElementById('content');
  const s = (data.per_ticker || {})[ticker];
  const tickerEvents = data.events.filter(e => e.ticker === ticker);

  if (!s) {
    content.innerHTML = `<div class="empty-state"><h3>No data for ${ticker}</h3></div>`;
    return;
  }

  let html = '';

  html += `<div class="stat-strip">
    <div class="stat">
      <div class="label">Events</div>
      <div class="value">${s.n_events}</div>
      <div class="note">unique trading-day observations</div>
    </div>
    <div class="stat">
      <div class="label">Mean CAR</div>
      <div class="value accent ${s.mean_CAR >= 0 ? '' : ''}">${fmtPct(s.mean_CAR)}</div>
      <div class="note">T+1 to T+3 abnormal return</div>
    </div>
    <div class="stat">
      <div class="label">Sentiment–return correlation</div>
      <div class="value">${s.correlation !== null ? fmtNum(s.correlation, 3) : '—'}</div>
      <div class="note">${s.correlation !== null ? (s.p_value < 0.05 ? 'significant at 0.05' : 'not significant') : 'need ≥4 events'}</div>
    </div>
    <div class="stat">
      <div class="label">Date range</div>
      <div class="value" style="font-size:18px;">${s.date_range[0]} to ${s.date_range[1]}</div>
      <div class="note">event dates covered</div>
    </div>
  </div>`;

  if (s.correlation === null) {
    html += `<div class="error-note" style="margin-bottom:32px;">${ticker} has fewer than 4 usable events so far — not enough to compute a per-stock correlation yet. Check back as more data accumulates.</div>`;
  }

  html += renderEventsTable(tickerEvents, `${ticker} Events <span class="count">(${tickerEvents.length} shown, most recent first)</span>`, false);

  content.innerHTML = html;
}

function renderEventsTable(events, headingHtml, showTickerColumn) {
  let html = `<section><h2>${headingHtml}</h2>`;

  if (events.length === 0) {
    html += `<div class="empty-state"><h3>No usable events yet</h3><p>Events need enough subsequent trading days of price data before they can be included.</p></div>`;
    html += `</section>`;
    return html;
  }

  html += `<table>
    <thead><tr>
      <th>Date</th>${showTickerColumn ? '<th>Ticker</th>' : ''}<th>Sentiment</th><th>Score</th><th>Confidence</th><th>Headlines</th><th>CAR</th><th>Headline</th>
    </tr></thead>
    <tbody>`;
  for (const e of events) {
    const carClass = e.CAR >= 0 ? 'car-pos' : 'car-neg';
    html += `<tr>
      <td>${e.datetime}</td>
      ${showTickerColumn ? `<td><a href="#" class="ticker-link" onclick="switchTab('${e.ticker}'); return false;">${e.ticker}</a></td>` : ''}
      <td><span class="badge ${e.label}">${e.label}</span></td>
      <td>${fmtNum(e.sentiment_score, 2)}</td>
      <td>${fmtNum(e.confidence, 2)}</td>
      <td>${e.n_headlines || 1}</td>
      <td class="${carClass}">${fmtPct(e.CAR)}</td>
      <td class="title-cell">${e.title}</td>
    </tr>`;
  }
  html += `</tbody></table></section>`;
  return html;
}

loadResults();
</script>
</body>
</html>
