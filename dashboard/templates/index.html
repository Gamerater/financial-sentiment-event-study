<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentiment &amp; Price Movement — Event Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F5F0;
    --paper-raised: #FCFBF8;
    --ink: #1A1F2B;
    --ink-soft: #4A4E58;
    --grey: #6B6459;
    --line: #DCD8CD;
    --positive: #2D5F4C;
    --negative: #8B3A3A;
    --gold: #9C7A2E;
    --gold-bg: #F1E8D2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 56px 32px 96px;
  }

  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 24px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }

  header h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    max-width: 620px;
  }

  header p.subtitle {
    margin: 0;
    color: var(--grey);
    font-size: 14px;
  }

  #reload-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  #reload-btn:hover { background: var(--ink-soft); }
  #reload-btn:disabled { opacity: 0.5; cursor: default; }

  .header-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  #export-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    padding: 9px 16px;
    cursor: pointer;
    white-space: nowrap;
  }
  #export-btn:hover { background: var(--paper-raised); }

  .freshness-line {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--grey);
  }
  .freshness-line .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--positive);
    margin-right: 6px;
  }

  /* Tab navigation */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 40px;
  }

  .tab {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--grey);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 14px;
    cursor: pointer;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--gold);
  }
  .tab .tab-count {
    color: var(--grey);
    font-size: 11.5px;
    margin-left: 4px;
  }

  .stat-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 48px;
  }

  .stat {
    padding: 20px 20px 20px 0;
    border-right: 1px solid var(--line);
  }
  .stat:last-child { border-right: none; padding-right: 0; }

  .stat .label {
    font-size: 12px;
    color: var(--grey);
    margin-bottom: 6px;
  }

  .stat .value {
    font-family: 'Source Serif 4', serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--ink);
  }

  .stat .value.accent { color: var(--gold); }
  .stat .note { font-size: 12px; color: var(--grey); margin-top: 4px; }

  section { margin-bottom: 52px; }

  h2 {
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 4px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  h2 .count {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--grey);
  }

  .test-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 20px;
  }

  .test-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 18px 20px;
  }

  .test-card h3 {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    text-transform: none;
    color: var(--grey);
    margin: 0 0 12px;
  }

  .test-card .row {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--line);
  }
  .test-card .row:last-child { border-bottom: none; }
  .test-card .row .k { color: var(--ink-soft); }
  .test-card .row .v { font-weight: 500; font-variant-numeric: tabular-nums; }

  .sig-true { color: var(--positive); font-weight: 600; }
  .sig-false { color: var(--grey); }

  .error-note {
    font-size: 13px;
    color: var(--grey);
    font-style: italic;
    padding: 6px 0;
  }

  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 20px;
  }

  .chart-box {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 12px;
  }
  .chart-box img {
    width: 100%;
    display: block;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 13.5px;
  }

  thead th {
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    color: var(--grey);
    padding: 8px 12px 8px 0;
    border-bottom: 1px solid var(--ink);
  }

  tbody td {
    padding: 10px 12px 10px 0;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }

  tbody tr:hover { background: var(--paper-raised); }
  tbody tr.clickable { cursor: pointer; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    font-size: 11.5px;
    font-weight: 600;
    border-radius: 2px;
  }
  .badge.positive { background: #E6EEE9; color: var(--positive); }
  .badge.negative { background: #F3E5E5; color: var(--negative); }
  .badge.neutral { background: #EDEBE5; color: var(--grey); }

  .ticker-link {
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px dotted var(--grey);
  }
  .ticker-link:hover { color: var(--gold); border-bottom-color: var(--gold); }

  .car-pos { color: var(--positive); font-weight: 600; }
  .car-neg { color: var(--negative); font-weight: 600; }

  .title-cell {
    max-width: 340px;
    color: var(--ink-soft);
  }

  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--grey);
    border: 1px dashed var(--line);
  }
  .empty-state h3 {
    font-family: 'Source Serif 4', serif;
    color: var(--ink);
    font-size: 18px;
    margin-bottom: 8px;
  }

  /* Per-ticker overview grid (shown on the "All stocks" tab) */
  .ticker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .ticker-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 16px;
    cursor: pointer;
  }
  .ticker-card:hover { border-color: var(--gold); }
  .ticker-card .tk-symbol {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    font-weight: 700;
  }
  .ticker-card .tk-n {
    font-size: 12px;
    color: var(--grey);
    margin-bottom: 10px;
  }
  .ticker-card .tk-car {
    font-size: 20px;
    font-weight: 600;
    font-family: 'Source Serif 4', serif;
  }
  .ticker-card .tk-car-label {
    font-size: 11px;
    color: var(--grey);
  }

  /* Event spotlight cards for tickers with very few events */
  .spotlight-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .spotlight-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    padding: 18px 20px;
  }
  .spotlight-date {
    font-size: 11.5px;
    color: var(--grey);
    margin-bottom: 10px;
  }
  .spotlight-car {
    font-family: 'Source Serif 4', serif;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .spotlight-car-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 400;
    color: var(--grey);
  }
  .spotlight-meta {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 10px 0 12px;
  }
  .spotlight-title {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
  }

  /* Events table search/filter controls */
  .table-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .search-box {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    min-width: 220px;
    flex: 1 1 220px;
  }
  .search-box:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
  .sentiment-filter {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
  }
  .filter-count {
    font-size: 12px;
    color: var(--grey);
    margin-left: auto;
  }

  footer {
    margin-top: 64px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--grey);
  }

  @media (max-width: 720px) {
    .stat-strip { grid-template-columns: repeat(2, 1fr); }
    .test-grid, .charts-grid { grid-template-columns: 1fr; }
    .stat:nth-child(2) { border-right: none; }
  }

  /* Export/print view */
  .export-view {
    font-family: 'Source Serif 4', serif;
  }
  .export-view h2 {
    font-family: 'Source Serif 4', serif;
    border-bottom: 1px solid var(--ink);
  }
  .export-view table { font-family: 'Inter', sans-serif; }
  .export-view .export-actions {
    margin-bottom: 24px;
  }
  .export-view .export-actions button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    margin-right: 8px;
  }
  .export-view .export-actions button.secondary {
    background: transparent;
    color: var(--ink);
  }
  .export-block {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 16px 20px;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 12.5px;
    white-space: pre-wrap;
    line-height: 1.7;
    margin-bottom: 32px;
  }

  @media print {
    #reload-btn, #export-btn, .header-buttons, #tabs, .freshness-line, footer, .table-controls { display: none !important; }
    body { background: white; }
    .wrap { max-width: 100%; padding: 0; }
    .export-view .export-actions { display: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Correlating Financial News Sentiment with Short-Term Stock Price Movement</h1>
      <p class="subtitle">An event-study approach · tech sector</p>
      <p class="freshness-line" id="freshness-line"></p>
    </div>
    <div class="header-buttons">
      <button id="export-btn" onclick="showExportView()">Export / Print</button>
      <button id="reload-btn" onclick="loadResults()">Reload results</button>
    </div>
  </header>

  <div id="tabs" class="tabs" style="display:none;"></div>

  <div id="content">
    <div class="empty-state"><h3>Loading…</h3></div>
  </div>

  <footer>
    Dashboard reads the latest output of <code>run_pipeline.py</code> from disk. Run the pipeline in a terminal, then reload here — this page does not fetch data or run the model itself.
  </footer>

</div>

<script>
let LAST_DATA = null;
let ACTIVE_TAB = 'all';

function fmtPct(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  return (n * 100).toFixed(2) + '%';
}
function fmtNum(v, digits=3) {
  const n = parseFloat(v);
  if (n === null || v === null || isNaN(n)) return '—';
  return n.toFixed(digits);
}
function sigClass(v) {
  return (v === 'True' || v === true) ? 'sig-true' : 'sig-false';
}
function sigLabel(v) {
  return (v === 'True' || v === true) ? 'Significant (p<0.05)' : 'Not significant';
}

function renderTestCard(title, data) {
  if (!data || Object.keys(data).length === 0) {
    return `<div class="test-card"><h3>${title}</h3><div class="error-note">No data yet</div></div>`;
  }
  if (data.error) {
    return `<div class="test-card"><h3>${title}</h3><div class="error-note">${data.error}</div></div>`;
  }
  let rows = '';
  for (const [k, v] of Object.entries(data)) {
    if (k === 'significant_at_0.05') continue;
    let displayV = v;
    if (k.toLowerCase().includes('mean_car') || k === 'pearson_r') displayV = fmtNum(v, 4);
    else if (k === 'p_value') displayV = fmtNum(v, 4);
    else if (k.includes('t_statistic')) displayV = fmtNum(v, 3);
    rows += `<div class="row"><span class="k">${k}</span><span class="v">${displayV}</span></div>`;
  }
  if ('significant_at_0.05' in data) {
    rows += `<div class="row"><span class="k">Result</span><span class="v ${sigClass(data['significant_at_0.05'])}">${sigLabel(data['significant_at_0.05'])}</span></div>`;
  }
  return `<div class="test-card"><h3>${title}</h3>${rows}</div>`;
}

function switchTab(tab) {
  ACTIVE_TAB = tab;
  renderTabs();
  renderContent();
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  if (!LAST_DATA || !LAST_DATA.has_data) {
    tabsEl.style.display = 'none';
    return;
  }
  const tickers = Object.keys(LAST_DATA.per_ticker || {}).sort();
  let html = `<button class="tab ${ACTIVE_TAB === 'all' ? 'active' : ''}" onclick="switchTab('all')">All stocks</button>`;
  html += `<button class="tab ${ACTIVE_TAB === 'trend' ? 'active' : ''}" onclick="switchTab('trend')">Trend over time</button>`;
  for (const t of tickers) {
    const n = LAST_DATA.per_ticker[t].n_events;
    html += `<button class="tab ${ACTIVE_TAB === t ? 'active' : ''}" onclick="switchTab('${t}')">${t}<span class="tab-count">${n}</span></button>`;
  }
  tabsEl.innerHTML = html;
  tabsEl.style.display = 'flex';
}

async function loadResults() {
  const btn = document.getElementById('reload-btn');
  btn.disabled = true;
  btn.textContent = 'Loading…';

  try {
    const res = await fetch('/api/results');
    const data = await res.json();
    LAST_DATA = data;
    renderTabs();
    renderContent();
    renderFreshness(data.freshness);
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="empty-state"><h3>Could not load results</h3><p>${e}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Reload results';
  }
}

function timeAgo(isoString) {
  if (!isoString) return null;
  const then = new Date(isoString);
  const diffMs = Date.now() - then.getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
  const days = Math.floor(hours / 24);
  return `${days} day${days === 1 ? '' : 's'} ago`;
}

function renderFreshness(freshness) {
  const el = document.getElementById('freshness-line');
  if (!freshness || (!freshness.last_pipeline_run && !freshness.last_fetch)) {
    el.innerHTML = '';
    return;
  }
  const parts = [];
  if (freshness.last_fetch) {
    parts.push(`Last data fetch: ${timeAgo(freshness.last_fetch)}`);
  }
  if (freshness.days_collecting !== null && freshness.days_collecting !== undefined) {
    parts.push(`${freshness.days_collecting} day${freshness.days_collecting === 1 ? '' : 's'} of automated collection`);
  }
  if (freshness.total_fetch_runs !== null && freshness.total_fetch_runs !== undefined) {
    parts.push(`${freshness.total_fetch_runs} successful fetch run${freshness.total_fetch_runs === 1 ? '' : 's'}`);
  }
  el.innerHTML = `<span class="dot"></span>${parts.join(' · ')}`;
}

function showExportView() {
  if (!LAST_DATA || !LAST_DATA.has_data) return;
  ACTIVE_TAB = '__export__';
  document.getElementById('tabs').style.display = 'none';

  const data = LAST_DATA;
  const corr = data.summary.correlation || {};
  const ttest = data.summary.group_ttest || {};
  const nEvents = data.summary.events_analyzed || data.n_events;
  const dates = data.events.map(e => e.datetime).sort();
  const dateRange = dates.length ? `${dates[0]} to ${dates[dates.length - 1]}` : '—';
  const generatedAt = new Date().toLocaleString();

  const plainText = buildExportText(data, nEvents, dateRange, generatedAt);

  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="export-view">
      <div class="export-actions">
        <button onclick="window.print()">Print / Save as PDF</button>
        <button class="secondary" onclick="copyExportText()">Copy as text</button>
        <button class="secondary" onclick="switchTab('all')">Back to dashboard</button>
      </div>
      <h2>Results Summary — for copying into your paper</h2>
      <p style="color:var(--grey); font-size:13px;">Generated ${generatedAt} from ${nEvents} events (${dateRange}).</p>
      <div class="export-block" id="export-text-block">${plainText}</div>
    </div>
  `;
}

function buildExportText(data, nEvents, dateRange, generatedAt) {
  const corr = data.summary.correlation || {};
  const ttest = data.summary.group_ttest || {};
  const lines = [];
  lines.push(`EVENT STUDY RESULTS SUMMARY`);
  lines.push(`Generated: ${generatedAt}`);
  lines.push(`Events analyzed: ${nEvents}`);
  lines.push(`Date range: ${dateRange}`);
  lines.push('');
  lines.push(`CORRELATION (sentiment score vs. cumulative abnormal return, all events)`);
  lines.push(`  Pearson r = ${fmtNum(corr.pearson_r, 4)}, p = ${fmtNum(corr.p_value, 4)}, n = ${corr.n_events || nEvents}`);
  lines.push(`  ${corr['significant_at_0.05'] === 'True' ? 'Statistically significant at the 0.05 level.' : 'Not statistically significant at the 0.05 level.'}`);
  lines.push('');
  lines.push(`GROUP COMPARISON (positive vs. negative sentiment events)`);
  if (ttest.error) {
    lines.push(`  ${ttest.error}`);
  } else {
    lines.push(`  Positive events: n=${ttest.n_positive}, mean CAR=${fmtNum(ttest.mean_CAR_positive, 4)}`);
    lines.push(`  Negative events: n=${ttest.n_negative}, mean CAR=${fmtNum(ttest.mean_CAR_negative, 4)}`);
    lines.push(`  t=${fmtNum(ttest.t_statistic, 3)}, p=${fmtNum(ttest.p_value, 4)}`);
    lines.push(`  ${ttest['significant_at_0.05'] === 'True' ? 'Statistically significant at the 0.05 level.' : 'Not statistically significant at the 0.05 level.'}`);
  }
  lines.push('');
  lines.push(`PER-TICKER BREAKDOWN`);
  const tickers = Object.keys(data.per_ticker || {}).sort();
  for (const t of tickers) {
    const s = data.per_ticker[t];
    const corrStr = s.correlation !== null ? `r=${fmtNum(s.correlation, 3)}, p=${fmtNum(s.p_value, 4)}` : 'insufficient events for correlation';
    lines.push(`  ${t}: n=${s.n_events}, mean CAR=${fmtNum(s.mean_CAR, 4)}, ${corrStr}`);
  }
  return lines.join('\n');
}

function copyExportText() {
  const block = document.getElementById('export-text-block');
  if (!block) return;
  navigator.clipboard.writeText(block.textContent).then(() => {
    const btn = document.querySelectorAll('.export-actions button.secondary')[0];
    if (btn) {
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = original; }, 1500);
    }
  });
}

function renderContent() {
  const data = LAST_DATA;
  const content = document.getElementById('content');

  if (!data || !data.has_data) {
    content.innerHTML = `
      <div class="empty-state">
        <h3>No results yet</h3>
        <p>Run <code>python run_pipeline.py</code> in a terminal, then click "Reload results".</p>
      </div>`;
    return;
  }

  if (ACTIVE_TAB === 'all') {
    renderAllStocksView(data);
  } else if (ACTIVE_TAB === 'trend') {
    renderTrendView();
  } else {
    renderTickerView(data, ACTIVE_TAB);
  }
}

function renderAllStocksView(data) {
  const content = document.getElementById('content');
  const corr = data.summary.correlation || {};
  const nEvents = data.summary.events_analyzed || data.n_events;
  const dates = data.events.map(e => e.datetime).sort();
  const dateRange = dates.length ? `${dates[0]} to ${dates[dates.length-1]}` : '—';

  let html = '';

  html += `<div class="stat-strip">
    <div class="stat">
      <div class="label">Events analyzed</div>
      <div class="value">${nEvents}</div>
      <div class="note">unique ticker-day observations</div>
    </div>
    <div class="stat">
      <div class="label">Sentiment–return correlation</div>
      <div class="value accent">${corr.pearson_r ? fmtNum(corr.pearson_r, 3) : '—'}</div>
      <div class="note">Pearson r, all events</div>
    </div>
    <div class="stat">
      <div class="label">p-value</div>
      <div class="value">${corr.p_value ? fmtNum(corr.p_value, 3) : '—'}</div>
      <div class="note">${corr['significant_at_0.05'] === 'True' ? 'significant at 0.05' : 'not significant at 0.05'}</div>
    </div>
    <div class="stat">
      <div class="label">Date range</div>
      <div class="value" style="font-size:18px;">${dateRange}</div>
      <div class="note">event dates covered</div>
    </div>
  </div>`;

  // Per-ticker overview cards
  const tickers = Object.keys(data.per_ticker || {}).sort();
  if (tickers.length > 0) {
    html += `<section>
      <h2>By Ticker <span class="count">(click a stock for detail)</span></h2>
      <div class="ticker-grid">`;
    for (const t of tickers) {
      const s = data.per_ticker[t];
      const carClass = s.mean_CAR >= 0 ? 'car-pos' : 'car-neg';
      html += `<div class="ticker-card" onclick="switchTab('${t}')">
        <div class="tk-symbol">${t}</div>
        <div class="tk-n">${s.n_events} event${s.n_events === 1 ? '' : 's'}</div>
        <div class="tk-car ${carClass}">${fmtPct(s.mean_CAR)}</div>
        <div class="tk-car-label">mean CAR</div>
      </div>`;
    }
    html += `</div></section>`;
  }

  html += `<section>
    <h2>Statistical Tests <span class="count">(all tickers combined)</span></h2>
    <div class="test-grid">
      ${renderTestCard('Group comparison — positive vs negative sentiment', data.summary.group_ttest)}
      ${renderTestCard('Correlation — sentiment score vs CAR', data.summary.correlation)}
      ${renderTestCard('One-sample test — positive events vs zero', data.summary.one_sample.positive)}
      ${renderTestCard('One-sample test — negative events vs zero', data.summary.one_sample.negative)}
    </div>
  </section>`;

  if (data.figures.length > 0) {
    html += `<section>
      <h2>Figures</h2>
      <div class="charts-grid">
        ${data.figures.map(f => `<div class="chart-box"><img src="/figures/${f}?t=${Date.now()}" alt="${f}"></div>`).join('')}
      </div>
    </section>`;
  }

  html += renderEventsTable(data.events, `Event Dataset <span class="count">(${data.events.length} shown, most recent first)</span>`, true);

  content.innerHTML = html;
}

function renderTickerView(data, ticker) {
  const content = document.getElementById('content');
  const s = (data.per_ticker || {})[ticker];
  const tickerEvents = data.events.filter(e => e.ticker === ticker);

  if (!s) {
    content.innerHTML = `<div class="empty-state"><h3>No data for ${ticker}</h3></div>`;
    return;
  }

  let html = '';

  html += `<div class="stat-strip">
    <div class="stat">
      <div class="label">Events</div>
      <div class="value">${s.n_events}</div>
      <div class="note">unique trading-day observations</div>
    </div>
    <div class="stat">
      <div class="label">Mean CAR</div>
      <div class="value accent ${s.mean_CAR >= 0 ? '' : ''}">${fmtPct(s.mean_CAR)}</div>
      <div class="note">T+1 to T+3 abnormal return</div>
    </div>
    <div class="stat">
      <div class="label">Sentiment–return correlation</div>
      <div class="value">${s.correlation !== null ? fmtNum(s.correlation, 3) : '—'}</div>
      <div class="note">${s.correlation !== null ? (s.p_value < 0.05 ? 'significant at 0.05' : 'not significant') : 'need ≥4 events'}</div>
    </div>
    <div class="stat">
      <div class="label">Date range</div>
      <div class="value" style="font-size:18px;">${s.date_range[0]} to ${s.date_range[1]}</div>
      <div class="note">event dates covered</div>
    </div>
  </div>`;

  if (s.correlation === null) {
    if (s.n_events <= 3) {
      // Very low sample: show the actual event(s) prominently instead of
      // just an apologetic note -- with 1-3 events there's nothing to
      // correlate yet, but the individual event(s) are still genuinely
      // interesting to look at, especially for a live demo.
      html += `<section>
        <h2>Event Spotlight <span class="count">(too few events yet for correlation — here ${s.n_events === 1 ? 'is the one event' : 'are the events'} on record)</span></h2>
        <div class="spotlight-grid">`;
      for (const e of tickerEvents) {
        const carClass = e.CAR >= 0 ? 'car-pos' : 'car-neg';
        html += `<div class="spotlight-card">
          <div class="spotlight-date">${e.datetime} · ${e.n_headlines || 1} headline${(e.n_headlines || 1) === 1 ? '' : 's'}</div>
          <div class="spotlight-car ${carClass}">${fmtPct(e.CAR)} <span class="spotlight-car-label">CAR (T+1 to T+3)</span></div>
          <div class="spotlight-meta"><span class="badge ${e.label}">${e.label}</span> sentiment score ${fmtNum(e.sentiment_score, 2)}, confidence ${fmtNum(e.confidence, 2)}</div>
          <div class="spotlight-title">${e.title}</div>
        </div>`;
      }
      html += `</div></section>`;
    } else {
      html += `<div class="error-note" style="margin-bottom:32px;">${ticker} has ${s.n_events} usable events so far — needs at least 4 to compute a per-stock correlation. Check back as more data accumulates.</div>`;
    }
  }

  html += renderEventsTable(tickerEvents, `${ticker} Events <span class="count">(${tickerEvents.length} shown, most recent first)</span>`, false);

  content.innerHTML = html;
}

function renderTrendView() {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="empty-state"><h3>Loading trend…</h3></div>`;

  fetch('/api/history')
    .then(res => res.json())
    .then(data => {
      const runs = data.runs || [];
      if (runs.length === 0) {
        content.innerHTML = `<div class="empty-state">
          <h3>No history yet</h3>
          <p>Trend data is logged automatically each time <code>run_pipeline.py</code> completes. Run it a few more times over the coming days to build up a history.</p>
        </div>`;
        return;
      }
      if (runs.length === 1) {
        content.innerHTML = `<div class="empty-state">
          <h3>Only one run logged so far</h3>
          <p>A trend needs at least two pipeline runs to show change over time. Run <code>run_pipeline.py</code> again on a later day and check back.</p>
        </div>`;
        return;
      }

      let html = `<section>
        <h2>Sample Size Over Time <span class="count">(${runs.length} pipeline runs logged)</span></h2>
        ${renderTrendSVG(runs, 'n_events', 'Events analyzed', '#1A1F2B', false)}
      </section>`;

      html += `<section>
        <h2>Sentiment–Return Correlation Over Time</h2>
        ${renderTrendSVG(runs, 'pearson_r', 'Pearson r', '#9C7A2E', true)}
      </section>`;

      html += `<section>
        <h2>Correlation p-value Over Time <span class="count">(dashed line at p = 0.05)</span></h2>
        ${renderTrendSVG(runs, 'corr_p_value', 'p-value', '#8B3A3A', false, 0.05)}
      </section>`;

      html += `<section>
        <h2>Run Log</h2>
        <table>
          <thead><tr><th>Run date</th><th>Events</th><th>Positive</th><th>Negative</th><th>Neutral</th><th>Pearson r</th><th>Corr. p-value</th><th>Group t-test p-value</th></tr></thead>
          <tbody>
            ${runs.slice().reverse().map(r => `<tr>
              <td>${r.run_timestamp.replace('T', ' ').slice(0, 16)}</td>
              <td>${r.n_events}</td>
              <td>${r.n_positive}</td>
              <td>${r.n_negative}</td>
              <td>${r.n_neutral}</td>
              <td>${fmtNum(r.pearson_r, 3)}</td>
              <td>${fmtNum(r.corr_p_value, 4)}</td>
              <td>${r.ttest_p_value !== null ? fmtNum(r.ttest_p_value, 4) : '—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </section>`;

      content.innerHTML = html;
    })
    .catch(e => {
      content.innerHTML = `<div class="empty-state"><h3>Could not load history</h3><p>${e}</p></div>`;
    });
}

function renderTrendSVG(runs, field, label, color, allowNegative, referenceLine=null) {
  const width = 960, height = 220, padL = 50, padR = 20, padT = 20, padB = 30;
  const values = runs.map(r => r[field]).filter(v => v !== null && v !== undefined);
  if (values.length === 0) {
    return `<div class="error-note">No data for ${label} yet.</div>`;
  }

  let minV = Math.min(...values, referenceLine !== null ? referenceLine : Infinity);
  let maxV = Math.max(...values, referenceLine !== null ? referenceLine : -Infinity);
  if (!allowNegative) minV = Math.min(minV, 0);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const rangePad = (maxV - minV) * 0.1;
  minV -= rangePad; maxV += rangePad;

  const n = runs.length;
  const xStep = n > 1 ? (width - padL - padR) / (n - 1) : 0;
  const yScale = v => height - padB - ((v - minV) / (maxV - minV)) * (height - padT - padB);
  const xScale = i => padL + i * xStep;

  let points = [];
  let path = '';
  runs.forEach((r, i) => {
    const v = r[field];
    if (v === null || v === undefined) return;
    const x = xScale(i), y = yScale(v);
    path += (path === '' ? 'M' : 'L') + x + ',' + y + ' ';
    points.push({x, y, v, i});
  });

  let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; background:var(--paper-raised); border:1px solid var(--line);">`;

  // zero line if range crosses zero and allowNegative
  if (allowNegative && minV < 0 && maxV > 0) {
    const y0 = yScale(0);
    svg += `<line x1="${padL}" y1="${y0}" x2="${width-padR}" y2="${y0}" stroke="#DCD8CD" stroke-width="1" />`;
  }
  // reference line (e.g. p=0.05)
  if (referenceLine !== null) {
    const yRef = yScale(referenceLine);
    svg += `<line x1="${padL}" y1="${yRef}" x2="${width-padR}" y2="${yRef}" stroke="#8B3A3A" stroke-width="1" stroke-dasharray="4,3" />`;
  }

  // axis labels (min/max)
  svg += `<text x="4" y="${yScale(maxV) + 4}" font-size="11" fill="#6B6459">${maxV.toFixed(field==='n_events'?0:3)}</text>`;
  svg += `<text x="4" y="${yScale(minV) + 4}" font-size="11" fill="#6B6459">${minV.toFixed(field==='n_events'?0:3)}</text>`;

  // line
  svg += `<path d="${path.trim()}" fill="none" stroke="${color}" stroke-width="2" />`;

  // points + tooltips (native <title>)
  for (const p of points) {
    const dateLabel = runs[p.i].run_timestamp.slice(0, 10);
    svg += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}"><title>${dateLabel}: ${p.v}</title></circle>`;
  }

  // x-axis date labels (first, middle, last only, to avoid crowding)
  const labelIndices = n <= 5 ? runs.map((_, i) => i) : [0, Math.floor((n-1)/2), n-1];
  for (const i of labelIndices) {
    const dateLabel = runs[i].run_timestamp.slice(5, 10); // MM-DD
    svg += `<text x="${xScale(i)}" y="${height-8}" font-size="10" fill="#6B6459" text-anchor="middle">${dateLabel}</text>`;
  }

  svg += `</svg>`;
  return svg;
}

let TABLE_STORE = {};
let TABLE_ID_COUNTER = 0;

function renderEventsTable(events, headingHtml, showTickerColumn) {
  const tableId = 'evtable_' + (TABLE_ID_COUNTER++);
  TABLE_STORE[tableId] = { events, showTickerColumn };

  let html = `<section>
    <h2>${headingHtml}</h2>
    <div class="table-controls">
      <input type="text" class="search-box" id="${tableId}_search" placeholder="Search headlines…" oninput="filterEventsTable('${tableId}')">
      <select class="sentiment-filter" id="${tableId}_filter" onchange="filterEventsTable('${tableId}')">
        <option value="all">All sentiment</option>
        <option value="positive">Positive</option>
        <option value="negative">Negative</option>
        <option value="neutral">Neutral</option>
      </select>
      <span class="filter-count" id="${tableId}_count"></span>
    </div>
    <div id="${tableId}_tablewrap"></div>
  </section>`;

  // Render the initial (unfiltered) table body right after insertion via a
  // microtask, since the container div doesn't exist in the DOM until this
  // returned HTML string is actually inserted by the caller.
  setTimeout(() => filterEventsTable(tableId), 0);

  return html;
}

function filterEventsTable(tableId) {
  const store = TABLE_STORE[tableId];
  if (!store) return;
  const wrap = document.getElementById(tableId + '_tablewrap');
  const countEl = document.getElementById(tableId + '_count');
  if (!wrap) return; // not yet in DOM (view switched away before timeout fired)

  const searchEl = document.getElementById(tableId + '_search');
  const filterEl = document.getElementById(tableId + '_filter');
  const searchText = (searchEl ? searchEl.value : '').trim().toLowerCase();
  const sentimentFilter = filterEl ? filterEl.value : 'all';

  let filtered = store.events;
  if (sentimentFilter !== 'all') {
    filtered = filtered.filter(e => e.label === sentimentFilter);
  }
  if (searchText) {
    filtered = filtered.filter(e => e.title.toLowerCase().includes(searchText) || e.ticker.toLowerCase().includes(searchText));
  }

  if (countEl) {
    countEl.textContent = filtered.length === store.events.length
      ? `${store.events.length} total`
      : `${filtered.length} of ${store.events.length} shown`;
  }

  wrap.innerHTML = renderEventsTableBody(filtered, store.showTickerColumn);
}

function renderEventsTableBody(events, showTickerColumn) {
  if (events.length === 0) {
    return `<div class="empty-state"><h3>No matching events</h3><p>Try a different search term or sentiment filter.</p></div>`;
  }

  let html = `<table>
    <thead><tr>
      <th>Date</th>${showTickerColumn ? '<th>Ticker</th>' : ''}<th>Sentiment</th><th>Score</th><th>Confidence</th><th>Headlines</th><th>CAR</th><th>Headline</th>
    </tr></thead>
    <tbody>`;
  for (const e of events) {
    const carClass = e.CAR >= 0 ? 'car-pos' : 'car-neg';
    html += `<tr>
      <td>${e.datetime}</td>
      ${showTickerColumn ? `<td><a href="#" class="ticker-link" onclick="switchTab('${e.ticker}'); return false;">${e.ticker}</a></td>` : ''}
      <td><span class="badge ${e.label}">${e.label}</span></td>
      <td>${fmtNum(e.sentiment_score, 2)}</td>
      <td>${fmtNum(e.confidence, 2)}</td>
      <td>${e.n_headlines || 1}</td>
      <td class="${carClass}">${fmtPct(e.CAR)}</td>
      <td class="title-cell">${e.title}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
  return html;
}
